<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>고객 목록 (Customers) — Selectly 웹 인쇄</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>고객 목록 (Customers)</h1>
    <nav><a href="index.html">← 인쇄 화면 (Print)</a> <a href="settings.html">⚙ 설정 (Settings)</a></nav>
  </header>

  <div class="filters non-printable">
    <label>시작일 (From) <input type="date" id="fromDate" /></label>
    <label>종료일 (To) <input type="date" id="toDate" /></label>
    <button id="resetFilter">전체 기간 (All time)</button>
    <button id="downloadExcelBtn">전체 내역 엑셀 다운로드 (Download All as Excel)</button>
    <span id="summary"></span>
  </div>

  <div class="non-printable">
    <table>
      <thead>
        <tr><th data-sort="displayName">이름 (Name)</th><th data-sort="count">건수 (Orders)</th><th data-sort="subtotal">합계 (Total, 원/KRW)</th></tr>
      </thead>
      <tbody id="customerRows"></tbody>
    </table>
  </div>

  <div id="receiptContainer"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script type="module" src="js/customersView.js"></script>
</body>
</html>
